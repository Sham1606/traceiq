services:
  postgres:
    image: postgres:17-alpine
    container_name: traceiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: traceiq
      POSTGRES_USER: traceiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - traceiq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceiq -d traceiq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  traceiq_postgres_data:
