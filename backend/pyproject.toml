[project]
name = "traceiq-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../data/src"]
addopts = "-q"
